name: DevSecOps Pipeline

on:
  push:
    branches: [devsecops-pipeline]
  pull_request:
    branches: [devsecops-pipeline]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

  sast:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven (tests opcionales)
        run: mvn -B clean verify

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=jakojazz_pet-clinic
            -Dsonar.organization=jakojazz
            -Dsonar.java.binaries=**/target/classes

  sca:
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Dependency-Check
        run: |
          curl -L https://github.com/jeremylong/DependencyCheck/releases/download/v10.0.3/dependency-check-10.0.3-release.zip -o dc.zip
          unzip dc.zip -d $HOME/dc
          sudo ln -s $HOME/dc/dependency-check/bin/dependency-check.sh /usr/local/bin/dependency-check

      - name: Run Dependency-Check
        run: |
          dependency-check \
            --project "pet-clinic" \
            --scan . \
            --format "HTML" \
            --out "odc-report" \
            --failOnCVSS 5
